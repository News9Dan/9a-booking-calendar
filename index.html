<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9A Show — Booking Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2024;
    --panel-2: #22262b;
    --border: #2e3338;
    --text: #e9e7e0;
    --text-mute: #8b929b;
    --amber: #f0a839;
    --amber-dim: #7a5a24;
    --green: #3fcf8e;
    --green-dim: #1f4d3a;
    --red: #e5595a;
    --red-dim: #4d2426;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  .masthead{
    border-bottom:2px solid var(--amber);
    padding-bottom:16px;
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .masthead h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:36px;
    letter-spacing:1.5px;
    margin:0;
    line-height:1;
  }
  .masthead .sub{
    font-size:13px;
    color:var(--text-mute);
    margin-top:4px;
    max-width:520px;
  }
  .note{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--amber);
    border-radius:4px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text-mute);
    margin-bottom:20px;
    line-height:1.5;
  }
  .note.error{border-left-color:var(--red);color:var(--red);}
  .weeknav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .weeknav .label{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    color:var(--amber);
    letter-spacing:0.5px;
  }
  .navbtn, .refresh-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:4px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .navbtn:hover, .refresh-btn:hover{border-color:var(--amber);color:var(--amber);}
  .navgroup{display:flex;gap:8px;align-items:center;}

  .grid{
    display:grid;
    grid-template-columns: 68px repeat(5, 1fr);
    gap:6px;
    overflow-x:auto;
  }
  .daycol-head{
    text-align:center;
    padding:8px 4px;
    font-size:12px;
    color:var(--text-mute);
    border-bottom:1px solid var(--border);
  }
  .daycol-head.today{color:var(--amber);}
  .daycol-head .dow{
    font-family:'Bebas Neue',sans-serif;
    font-size:16px;
    letter-spacing:1px;
    color:var(--text);
    display:block;
  }
  .daycol-head.today .dow{color:var(--amber);}
  .daycol-head .dnum{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
  }
  .time-label{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-mute);
    min-height:74px;
  }
  .cell{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    min-height:74px;
    padding:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:border-color 0.15s;
  }
  .cell.open:hover{border-color:var(--green);}
  .cell.open .plus{color:var(--green);font-size:13px;font-weight:600;}
  .cell.past{cursor:not-allowed;opacity:0.3;}
  .cell.locked{
    align-items:flex-start;
    cursor:default;
    border-color:var(--red-dim);
    background:var(--red-dim);
  }
  .cell.locked .name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;word-break:break-word;}
  .cell.locked .topic{font-size:11px;color:var(--text-mute);line-height:1.3;margin-top:2px;word-break:break-word;}
  .cell.locked .clear-x{
    align-self:flex-end;font-size:11px;color:var(--text-mute);
    background:none;border:none;cursor:pointer;padding:0;margin-top:4px;
  }
  .cell.locked .clear-x:hover{color:var(--red);}

  .legend{display:flex;gap:16px;font-size:12px;color:var(--text-mute);margin-top:20px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px;width:100%;max-width:400px;}
  .modal h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin:0 0 4px;}
  .modal .modal-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);margin-bottom:16px;}
  .modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-mute);margin-bottom:4px;margin-top:12px;}
  .modal label:first-of-type{margin-top:0;}
  .modal input[type=text], .modal textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;
  }
  .modal textarea{resize:vertical;min-height:56px;}
  .modal input:focus, .modal textarea:focus{outline:none;border-color:var(--amber);}
  .modal-actions{margin-top:18px;display:flex;gap:8px;}
  .submit-btn, .cancel-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;border-radius:4px;
    padding:9px 14px;cursor:pointer;border:1px solid var(--border);
  }
  .submit-btn{background:var(--amber);color:#1a1200;border-color:var(--amber);flex:1;}
  .submit-btn:hover{opacity:0.9;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .cancel-btn{background:var(--panel-2);color:var(--text);}
  .loading{color:var(--text-mute);font-size:13px;padding:30px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>9A Show — Booking Calendar</h1>
      <div class="sub">Pick an open time to join the 9 a.m. broadcast, or claim a slot to add content to the show.</div>
    </div>
  </div>

  <div id="statusNote" class="note">Loading calendar…</div>

  <div class="weeknav">
    <div class="navgroup">
      <button class="navbtn" id="prevBtn">‹ Previous week</button>
      <button class="navbtn" id="nextBtn">Next week ›</button>
    </div>
    <div class="label" id="weekLabel"></div>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>

  <div id="gridHost"><div class="loading">Loading calendar…</div></div>

  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span>Open — click to book</span>
    <span><span class="dot" style="background:var(--red)"></span>Booked</span>
  </div>
</div>

<div id="modalHost"></div>

<script>
// ============================================================
// PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
const API_URL = "https://script.google.com/macros/s/AKfycbxCQnPoVbi3Dm9u96mHwNJq0xdIW3r6_50sSL48TeCc2TMhSG0zN-9p9YiaeCIHd-CyNw/exec";
// ============================================================

const SLOT_TIMES = ["9:00 AM", "9:10 AM", "9:30 AM", "9:40 AM"];
let bookings = {}; // { dateKey: [slot0,slot1,slot2,slot3] }
let weekStart = mondayOf(new Date());

function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function fmtDateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isPast(d){
  const today = new Date(); today.setHours(0,0,0,0);
  return d < today;
}
function isToday(d){
  const today = new Date(); today.setHours(0,0,0,0);
  return fmtDateKey(d) === fmtDateKey(today);
}
function setStatus(msg, isError){
  const n = document.getElementById('statusNote');
  n.textContent = msg;
  n.className = 'note' + (isError ? ' error' : '');
}

async function loadBookings(){
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    setStatus('Setup needed: paste your Apps Script Web App URL into API_URL near the top of the <script> tag.', true);
    document.getElementById('gridHost').innerHTML = '';
    render();
    return;
  }
  try{
    const res = await fetch(API_URL, { method: 'GET' });
    const rows = await res.json();
    bookings = {};
    rows.forEach(r => {
      if(!bookings[r.dateKey]) bookings[r.dateKey] = [null,null,null,null];
      const idx = Number(r.slotIndex);
      bookings[r.dateKey][idx] = { status:'locked', name:r.name, topic:r.org + ' — ' + r.topic, contact:r.contact };
    });
    setStatus('Green squares are open. Pick a day and time — once booked, it locks and everyone viewing this page sees it.');
  }catch(e){
    setStatus('Could not load the calendar from the backend. Check that the Apps Script URL is correct and deployed with "Anyone" access.', true);
  }
  render();
}

async function postAction(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify(payload)
  });
  return res.json();
}

function getSlot(dateKey, slotIdx){
  return (bookings[dateKey] && bookings[dateKey][slotIdx]) ? bookings[dateKey][slotIdx] : null;
}

function render(){
  const days = [];
  for(let i=0;i<5;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  const weekEnd = days[4];
  document.getElementById('weekLabel').textContent =
    weekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' – ' +
    weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  const host = document.getElementById('gridHost');
  host.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';

  grid.appendChild(document.createElement('div'));
  days.forEach(d=>{
    const head = document.createElement('div');
    head.className = 'daycol-head' + (isToday(d) ? ' today' : '');
    head.innerHTML = `<span class="dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</span><span class="dnum">${d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}</span>`;
    grid.appendChild(head);
  });

  SLOT_TIMES.forEach((time, slotIdx)=>{
    const label = document.createElement('div');
    label.className = 'time-label';
    label.textContent = time;
    grid.appendChild(label);

    days.forEach(d=>{
      const dateKey = fmtDateKey(d);
      const slot = getSlot(dateKey, slotIdx);
      const cell = document.createElement('div');
      const past = isPast(d);

      if(slot && slot.status === 'locked'){
        cell.className = 'cell locked';
        cell.innerHTML = `<div class="name">${escapeHtml(slot.name)}</div><div class="topic">${escapeHtml(slot.topic)}</div>`;
        const clearBtn = document.createElement('button');
        clearBtn.className = 'clear-x';
        clearBtn.textContent = 'Remove';
        clearBtn.onclick = (e)=>{ e.stopPropagation(); clearSlot(dateKey, slotIdx); };
        cell.appendChild(clearBtn);
      } else if(past){
        cell.className = 'cell past';
        cell.innerHTML = `<span class="plus" style="color:var(--text-mute)">—</span>`;
      } else {
        cell.className = 'cell open';
        cell.innerHTML = `<span class="plus">+ Book</span>`;
        cell.onclick = ()=> openModal(dateKey, slotIdx, d, time);
      }
      grid.appendChild(cell);
    });
  });

  host.appendChild(grid);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function openModal(dateKey, slotIdx, dateObj, time){
  const host = document.getElementById('modalHost');
  host.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e)=>{ if(e.target === overlay) host.innerHTML=''; };

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h3>Book this slot</h3>
    <div class="modal-sub">${dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} — ${time}</div>
    <label>Your name</label>
    <input type="text" id="m-name" placeholder="First and last name">
    <label>Organization / department</label>
    <input type="text" id="m-org" placeholder="e.g. your company, or your newsroom department">
    <label>What's this for?</label>
    <textarea id="m-topic" placeholder="Short description of the segment or topic"></textarea>
    <label>Contact</label>
    <input type="text" id="m-contact" placeholder="Email or phone">
  `;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'Confirm booking';
  submitBtn.onclick = ()=> confirmBooking(dateKey, slotIdx, submitBtn);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'cancel-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = ()=> { host.innerHTML=''; };
  actions.appendChild(submitBtn);
  actions.appendChild(cancelBtn);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  host.appendChild(overlay);
  document.getElementById('m-name').focus();
}

async function confirmBooking(dateKey, slotIdx, submitBtn){
  const name = document.getElementById('m-name').value.trim();
  const org = document.getElementById('m-org').value.trim();
  const topic = document.getElementById('m-topic').value.trim();
  const contact = document.getElementById('m-contact').value.trim();
  if(!name || !org || !topic || !contact){
    alert('Fill in your name, organization/department, what this is for, and a contact.');
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Booking…';
  try{
    await postAction({ action:'book', dateKey, slotIndex: slotIdx, name, org, topic, contact });
    document.getElementById('modalHost').innerHTML = '';
    await loadBookings();
  }catch(e){
    alert('Could not save this booking. Check your connection and try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Confirm booking';
  }
}

async function clearSlot(dateKey, slotIdx){
  if(!confirm('Remove this booking?')) return;
  try{
    await postAction({ action:'clear', dateKey, slotIndex: slotIdx });
    await loadBookings();
  }catch(e){
    alert('Could not remove this booking. Check your connection and try again.');
  }
}

document.getElementById('prevBtn').onclick = ()=>{ weekStart.setDate(weekStart.getDate()-7); render(); };
document.getElementById('nextBtn').onclick = ()=>{ weekStart.setDate(weekStart.getDate()+7); render(); };
document.getElementById('refreshBtn').onclick = ()=> loadBookings();

loadBookings();
</script>
</body>
</html>
